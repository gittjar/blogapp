services:
  # Frontend (Static Site)
  - type: web
    name: blogapp-frontend
    env: static
    buildCommand: cd blogapp-frontend && npm install && npm run build
    staticPublishPath: blogapp-frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend (Node.js API)
  - type: web
    name: blogapp-backend
    env: node
    buildCommand: cd blogapp-backend && npm install
    startCommand: cd blogapp-backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SERVER
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
